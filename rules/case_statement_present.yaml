topic: a1-smoke
severity: warning
why-bad: |
  A1 smoke rule. Flags any kCaseStatement. Demonstrates the engine handles
  a different node-tag pattern from the always_statement_present rule.
suggested-fix: |
  In real designs, simple case statements can often be replaced with ternary
  expressions or explicit FSM coding patterns; default branches are required
  to avoid latch inference.
